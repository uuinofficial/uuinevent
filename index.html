<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>UUIN 地球日小測驗</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;700&family=Playfair+Display:ital,wght@0,400;1,700&display=swap" rel="stylesheet">
    <style>
        :root { 
            --vh: 1vh; 
            --uuin-gold: #a68b5b; 
            --eco-green: #4a674f;
            --paper-overlay: rgba(255, 255, 255, 0.6); 
        }
        html, body { height: 100%; width: 100%; margin: 0; padding: 0; overflow: hidden; }
        body { 
            font-family: 'Noto Sans TC', sans-serif; 
            -webkit-tap-highlight-color: transparent;
            display: flex; align-items: center; justify-content: center;
            height: calc(var(--vh) * 100);
            background-color: #e8e2d6;
            background-image: url("https://cdn.phototourl.com/free/2026-04-02-042dc7c9-01e4-4aa7-aea6-fefa7d14bc4f.jpg");
            background-size: cover;
        }

        .main-card { 
            background-image: linear-gradient(var(--paper-overlay), var(--paper-overlay)), url('https://cdn.phototourl.com/free/2026-04-02-140da8f3-a2ec-469f-8346-3f3075cc3be4.png');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            backdrop-filter: blur(2px);
            -webkit-backdrop-filter: blur(2px);
            border-radius: 32px; 
            box-shadow: 0 40px 80px rgba(0, 0, 0, 0.15); 
            width: 90%; max-width: 420px; 
            height: 85%; max-height: 750px; 
            position: relative; overflow: hidden; display: flex; flex-direction: column;
            border: 8px solid white;
        }

        .page-container {
            flex: 1; display: flex; flex-direction: column;
            overflow-y: auto; padding: 2rem 1.5rem;
            scrollbar-width: none;
            z-index: 2;
        }
        .page-container::-webkit-scrollbar { display: none; }

        .btn-option { 
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); 
            border: 1px solid rgba(166, 139, 91, 0.2); 
            background: rgba(255, 255, 255, 0.92); 
            width: 100%; text-align: left; padding: 12px 16px; border-radius: 18px;
            font-size: 15px; color: #1a2a1b; margin-bottom: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
            font-weight: 500;
            display: flex; align-items: center; gap: 12px;
        }
        .btn-option:hover { border-color: var(--eco-green); background: #fff; transform: translateY(-2px); }
        .btn-option:active { background: var(--eco-green) !important; color: #fff !important; }
        .btn-option.selected { border-color: var(--eco-green); background: rgba(74, 103, 79, 0.05); }

        .option-img {
            width: 50px; height: 50px; border-radius: 12px; overflow: hidden;
            background: #f0f0f0; flex-shrink: 0; display: none;
        }
        .option-img img { width: 100%; height: 100%; object-fit: cover; }
        .has-image .option-img { display: block; }

        .btn-next {
            width: 100%; margin-top: 2rem; padding: 14px; border-radius: 18px;
            background: var(--eco-green); color: white; font-weight: 700;
            letter-spacing: 0.2em; font-size: 14px; transition: all 0.3s;
            box-shadow: 0 4px 12px rgba(74, 103, 79, 0.2);
            opacity: 0.5; pointer-events: none;
        }
        .btn-next.enabled { opacity: 1; pointer-events: auto; }
        .btn-next:active { transform: scale(0.98); opacity: 0.9; }

        #toast-overlay {
            position: absolute; inset: 0; background: rgba(0,0,0,0.4);
            z-index: 100; display: none; align-items: center; justify-content: center;
            backdrop-filter: blur(4px);
        }
        #toast {
            background: rgba(45, 66, 48, 0.98); color: white; padding: 32px 28px;
            border-radius: 28px; font-size: 14px; width: 88%;
            box-shadow: 0 20px 50px rgba(0,0,0,0.35);
            line-height: 1.6; letter-spacing: 0.05em;
            text-align: center; transform: scale(0.9); transition: transform 0.3s ease;
        }
        #toast-overlay.show { display: flex; }
        #toast-overlay.show #toast { transform: scale(1); }

        .progress-bar { 
            height: 8px; width: 100%; margin-bottom: 2.5rem; 
            display: flex; gap: 6px; cursor: pointer;
        }
        .progress-segment {
            height: 100%; flex: 1; transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            background: rgba(0, 0, 0, 0.08); border-radius: 4px; position: relative;
        }
        .progress-segment.active { 
            background: var(--eco-green); box-shadow: 0 2px 4px rgba(74, 103, 79, 0.2);
        }
        .progress-segment.locked { cursor: not-allowed; opacity: 0.4; }

        .coupon-card { perspective: 1000px; width: 100%; height: 240px; margin: 1.5rem 0; }
        .coupon-inner {
            position: relative; width: 100%; height: 100%; text-align: center;
            transition: transform 0.8s; transform-style: preserve-3d; cursor: pointer;
        }
        .coupon-inner.flipped { transform: rotateY(180deg); }
        .coupon-front, .coupon-back {
            position: absolute; width: 100%; height: 100%; backface-visibility: hidden;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            border-radius: 24px; border: 3px dashed var(--uuin-gold);
            padding: 20px;
        }
        .coupon-front { background: white; color: var(--uuin-gold); }
        .coupon-back { background: var(--uuin-gold); color: white; transform: rotateY(180deg); }

        .fade-in { animation: fadeIn 0.6s ease forwards; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        .uuin-title { font-family: 'Playfair Display', serif; letter-spacing: 0.1em; }
        .earth-day-text { font-family: 'Playfair Display', serif; font-style: italic; font-weight: 700; }
        .eco-green { color: var(--eco-green); }
        .clickable { cursor: pointer; }
    </style>
</head>
<body>
    <div id="app" class="main-card">
        <div id="toast-overlay">
            <div id="toast">
                <div id="toast-body" class="mb-4"></div>
                <button onclick="closeKnowledge()" class="mt-4 w-full bg-white text-[#4a674f] py-3 rounded-full font-bold text-sm tracking-widest shadow-sm hover:bg-gray-100 transition-colors">
                    返回題目頁 ↵
                </button>
            </div>
        </div>

        <div id="page-start" class="page-container items-center justify-between text-center">
            <div class="mt-4">
                <span class="text-[10px] tracking-[0.5em] text-gray-500 uppercase font-medium">Earth Day Action</span>
                <h1 class="text-4xl font-bold mt-4 mb-1 uuin-title text-gray-900 tracking-widest">UUIN</h1>
                <div class="flex items-center justify-center gap-3 mb-2">
                    <div class="h-[1px] w-6 bg-eco-green/30"></div>
                    <span class="earth-day-text eco-green text-xl">Earth Day</span>
                    <div class="h-[1px] w-6 bg-eco-green/30"></div>
                </div>
                <p class="text-[11px] text-gray-500 tracking-[0.3em] font-light">永續生活美學</p>
            </div>
            
            <div class="w-full py-12 fade-in">
                <p class="text-[20px] font-bold leading-loose text-gray-800 tracking-widest">
                    <span class="eco-green">🌍開啟你的綠色旅程！</span><br>
                    <span class="text-[15px] font-medium text-gray-500 mt-4 block italic tracking-normal">完成測驗，解鎖專屬購物金</span>
                </p>
            </div>
            
            <div class="w-full pb-4">
                <button onclick="startQuiz()" class="w-full bg-[#4a674f] text-white py-5 rounded-full font-bold tracking-[0.3em] shadow-lg hover:shadow-xl active:scale-[0.98] transition-all">
                    進入測驗 ▸
                </button>
                <p class="text-[9px] text-gray-400 mt-8 tracking-widest uppercase font-light">EST. 2026 TAIWAN DESIGN</p>
            </div>
        </div>

        <div id="page-quiz" class="hidden page-container">
            <div id="progress-bar" class="progress-bar">
                <div class="progress-segment" onclick="jumpToQuestion(0)" title="第1題"></div>
                <div class="progress-segment" onclick="jumpToQuestion(1)" title="第2題"></div>
                <div class="progress-segment" onclick="jumpToQuestion(2)" title="第3題"></div>
                <div class="progress-segment" onclick="jumpToQuestion(3)" title="第4題"></div>
                <div class="progress-segment" onclick="jumpToQuestion(4)" title="第5題"></div>
            </div>
            <div id="quiz-content" class="fade-in">
                <span id="q-step" class="text-[10px] text-gray-600 font-bold tracking-[0.2em]">STEP 01</span>
                <h2 id="q-text" class="text-xl font-bold mt-4 mb-8 leading-snug text-gray-900"></h2>
                <div id="options" class="space-y-1"></div>
                <button id="next-q-btn" onclick="goToNextQuestion()" class="btn-next">
                    進入下一題 ▸
                </button>
            </div>
        </div>

        <div id="page-result" class="hidden page-container items-center text-center">
            <div class="mb-2">
                <div class="text-4xl mb-4">🌱</div>
                <h1 class="text-2xl font-bold mb-1 text-gray-900">測驗完成！</h1>
                <p class="text-[11px] text-gray-600">你已成功完成永續挑戰，獲得專屬禮物</p>
            </div>

            <div class="coupon-card" onclick="flipCoupon(this)">
                <div class="coupon-inner" id="coupon-inner">
                    <div class="coupon-front shadow-md">
                        <p class="text-[10px] tracking-widest uppercase mb-2">Earth Day Reward</p>
                        <p class="text-2xl font-bold">點擊領取專屬驚喜</p>
                        <div class="w-10 h-10 rounded-full border border-gray-200 mt-6 flex items-center justify-center animate-bounce">
                            <span class="text-sm">▾</span>
                        </div>
                    </div>
                    <div class="coupon-back shadow-lg">
                        <p class="text-[12px] tracking-widest uppercase mb-1 text-white/90 font-bold">UUIN SPECIAL GIFT</p>
                        <p class="text-4xl font-bold mb-2">500元購物金</p>
                        <p class="text-[11px] bg-white/20 px-4 py-1 rounded-full mb-6">使用期間 6/26 - 7/6</p>
                        <div class="h-[1px] w-full bg-white/30 mb-6"></div>
                        <p class="text-[14px] font-bold tracking-wider px-2">
                            請出示此畫面至櫃檯<br>結帳即可享優惠
                        </p>
                    </div>
                </div>
            </div>

            <div class="w-full space-y-4">
                <button onclick="location.reload()" class="w-full bg-[#4a674f] text-white py-4 rounded-full font-bold text-sm tracking-[0.3em] shadow-md hover:shadow-lg transition-all active:scale-[0.98]">
                    再玩一次 ▸
                </button>
                <p class="text-[10px] text-gray-400 tracking-widest">EST. 2026 TAIWAN DESIGN</p>
            </div>
        </div>
    </div>

    <script>
        const setVh = () => { document.documentElement.style.setProperty('--vh', `${window.innerHeight * 0.01}px`); };
        window.addEventListener('resize', setVh); setVh();

        const quizData = [
            { 
                q: "今天出門，你會選哪種低碳方式？", 
                options: [
                    {t:"步行欣賞街景", tip:"🚶‍♂️ <b>低碳又放鬆！</b><br><br>💡永續小知識： <br> 步行是零排放的交通方式，每步行1公里可減少0.2 公斤的碳排放量。"}, 
                    {t:"騎腳踏車", tip:"🚴‍♀️ <b>雙輪代步，健康永續！</b><br><br>💡永續小知識： <br> 相較開車，騎腳踏車幾乎是「零碳排」，同時還能提升身體健康。"}, 
                    {t:"搭公車聊天", tip:"🚌 <b>大眾運輸，分享低碳！</b><br><br>💡永續小知識： <br> 大眾運輸可大幅降低城市空汙，是城市永續的重要關鍵。"}, 
                    {t:"電動滑板車", tip:"🛴 <b>微型交通，靈活環保！</b><br><br>💡永續小知識： <br> 使用電力替代燃油，有助減少空氣污染。"}
                ] 
            },
            { 
                q: "今天出門逛街，看到一件喜歡的衣服，你會怎麼做？", 
                options: [
                    {t:"先看看衣櫃有沒有類似款", tip:"♻️ <b>重複穿搭是最時尚的永續！</b><br><br>💡永續小知識： <br> 延長每件衣服的穿著次數，可大幅降低碳足跡與資源消耗。"}, 
                    {t:"挑選耐穿經典款 ", tip:"🛍 <b>經典款更耐用，對環境友善！</b><br><br>💡永續小知識： <br>減少快速淘汰的衣物，降低紡織浪費。"}, 
                    {t:"支持永續理念的品牌", tip:"🌿 <b>你的選擇，正在邁向更好的未來！</b><br><br>💡永續小知識：<br>選擇永續理念的品牌，推動整體產業更友善環境。"}, 
                    {t:"選擇永續材質的衣物", tip:"👕 <b>永續從源頭開始</b><br><br>💡永續小知識：<br>選擇天然或再生纖維，減少水資源消耗與碳足跡。"}
                ] 
            },
            { q: "選一種你認同的衣物價值觀", options: [{t:"少買一點，但穿久一點", tip:"🧵 <b>穿得久，愛地球！</b><br><br>💡永續小知識：<br> 延長衣物使用壽命，減少資源浪費，大幅降低碳排放。多次穿搭是對地球的小小行動。"}, {t:"了解材質來源與製程", tip:"🔍 <b>理解衣服的材質，是開啟永續消費的第一步。</b><br><br>💡永續小知識：<br> 透明供應鏈是永續時尚的重要指標，挑選環保耐用的單品。"}, {t:"支持對環境友善的設計", tip:"🌱 <b>設計，也能改變世界</b><br><br>💡永續小知識：<br> 從設計端減少浪費，是品牌的重要責任。"}, {t:"讓穿搭成為一種態度", tip:"✨ <b>風格，就是你的價值觀</b><br><br>💡永續小知識：<br> 當消費變成選擇，風格也能影響世界。"}] },
            { 
                q: "點一個你最有興趣的永續面料吧！", 
                options: [
                    {t:"水洗真絲", img:"https://cdn.phototourl.com/free/2026-04-07-76cb4065-aeda-4c26-9af8-419da69176f1.jpg", tip:"🌟 <b>觸感極佳且耐用！</b><br><br>💡永續小知識： <br> 水洗真絲減少化學處理，延長衣物壽命，也降低環境負擔。"}, 
                    {t:"聚酯纖維", img:"https://cdn.phototourl.com/free/2026-04-07-2433f92f-80bb-4b34-8500-65c0dc77e966.jpg", tip:"♻️ <b>讓舊料重生！</b><br><br>💡永續小知識： <br> 約5–10個回收寶特瓶 可製成一件衣物，讓廢棄塑膠重新被利用。"}, 
                    {t:"天然纖維（棉、麻、羊毛）", img:"https://cdn.phototourl.com/free/2026-04-07-a2889b40-3fa5-4f57-b56b-17e278aa432b.jpg", tip:"🌳 <b>取之自然，用之自然</b><br><br>💡永續小知識： <br> 選用天然纖維，尤其有機或永續認證的材質，可減少農藥與化學加工。"}, 
                    {t:"咖啡渣纖維", img:"https://cdn.phototourl.com/free/2026-04-07-162fc952-b54a-4066-a013-b72c953110c8.jpg", tip:"☕ <b>創新材質，友善環境</b><br><br>💡永續小知識： <br> 將咖啡渣製成纖維，不僅減少廢棄物，也能賦予衣物天然抗菌特性。"}
                ] 
            },
            { q: "今天你會怎麼慶祝地球日？", options: [{t:"捕捉大自然的美景", tip:"📸 <b>留住地球的美</b><br><br>💡永續小知識： <br> 當你開始觀察自然，就更願意守護它。"}, {t:"參加社區環保活動", tip:"🌳 <b>行動派代表！</b><br><br>💡永續小知識： <br> 參與社區活動不只能改善環境，也能影響更多人加入永續行動。"}, {t:"和朋友聊聊環保", tip:"💬 <b>影響力，從對話開始！</b><br><br>💡永續小知識： <br> 知識傳播能形成共識，當環保變成一種社交潮流。"}, {t:"DIY環保小物", tip:"🛠 <b>物盡其用，創意永續生活！</b><br><br>💡永續小知識： <br> 修改舊物或DIY能減少購買需求，從源頭落實減廢生活。"}] }
        ];

        let current = 0;
        let maxReached = 0; 

        function showKnowledge(text) {
            const overlay = document.getElementById('toast-overlay');
            const body = document.getElementById('toast-body');
            body.innerHTML = text;
            overlay.classList.add('show');
            document.getElementById('next-q-btn').classList.add('enabled');
        }

        function closeKnowledge() {
            document.getElementById('toast-overlay').classList.remove('show');
        }

        function goToNextQuestion() {
            current++;
            if (current > maxReached) maxReached = current; 
            if (current < 5) renderQuestion();
            else finishQuiz();
        }

        function startQuiz() {
            document.getElementById('page-start').classList.add('hidden');
            document.getElementById('page-quiz').classList.remove('hidden');
            renderQuestion();
        }

        function jumpToQuestion(index) {
            if (index <= maxReached) {
                current = index;
                renderQuestion();
            }
        }

        function renderQuestion() {
            const data = quizData[current];
            const content = document.getElementById('quiz-content');
            content.classList.remove('fade-in');
            void content.offsetWidth;
            content.classList.add('fade-in');

            document.getElementById('q-step').innerText = `STEP 0${current+1}`;
            document.getElementById('q-text').innerText = data.q;
            
            const nextBtn = document.getElementById('next-q-btn');
            nextBtn.classList.remove('enabled');
            nextBtn.innerText = current === 4 ? "查看測驗結果 ▸" : "進入下一題 ▸";

            const segments = document.querySelectorAll('.progress-segment');
            segments.forEach((seg, i) => {
                seg.classList.remove('active', 'locked');
                if (i <= current) seg.classList.add('active');
                else if (i > maxReached) seg.classList.add('locked');
            });
            
            const optBox = document.getElementById('options');
            optBox.innerHTML = '';
            data.options.forEach(o => {
                const b = document.createElement('button');
                b.className = 'btn-option';
                
                if (o.img) {
                    b.classList.add('has-image');
                    b.innerHTML = `
                        <div class="option-img">
                            <img src="${o.img}" alt="${o.t}" onerror="this.style.display='none'">
                        </div>
                        <span class="flex-1">${o.t}</span>
                    `;
                } else {
                    b.innerText = o.t;
                }
                
                b.onclick = () => {
                    document.querySelectorAll('.btn-option').forEach(btn => btn.classList.remove('selected'));
                    b.classList.add('selected');
                    showKnowledge(o.tip);
                };
                optBox.appendChild(b);
            });
        }

        function finishQuiz() {
            setTimeout(() => {
                document.getElementById('page-quiz').classList.add('hidden');
                document.getElementById('page-result').classList.remove('hidden');
            }, 400);
        }

        function flipCoupon(el) {
            el.querySelector('.coupon-inner').classList.add('flipped');
        }
    </script>
</body>
</html>
